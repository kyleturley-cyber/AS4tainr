name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: Rust core + bridge conformance
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: openeye
          POSTGRES_PASSWORD: openeye
          POSTGRES_DB: openeye
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U openeye" --health-interval 2s --health-retries 30
    env:
      OPENEYE_TEST_DATABASE_URL: postgres://openeye:openeye@127.0.0.1/openeye
      OPENEYE_DATABASE_URL: postgres://openeye:openeye@127.0.0.1/openeye
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Compile the dependency-free bridge client and conformance runner
        run: javac -d target/conformance-classes jvm/src/main/java/io/openeye/bridge/*.java jvm/src/test/java/io/openeye/bridge/*.java
      - name: End-to-end with the conformance runner
        env:
          OPENEYE_BIN: target/debug/openeye
          OPENEYE_RUNNER: java -cp target/conformance-classes io.openeye.bridge.BridgeConformance
        run: |
          scripts/demo.sh
          target/debug/openeye call SELFTEST

  jariko:
    name: Jariko runner end to end
    runs-on: ubuntu-latest
    needs: core
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: openeye
          POSTGRES_PASSWORD: openeye
          POSTGRES_DB: openeye
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U openeye" --health-interval 2s --health-retries 30
    env:
      OPENEYE_DATABASE_URL: postgres://openeye:openeye@127.0.0.1/openeye
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: cargo build --locked
      - name: Build openeye-jvm.jar (Jariko + bridge adapter)
        working-directory: jvm
        run: ./gradlew --no-daemon fatJar
      - name: Run the sample RPG programs on Jariko against PostgreSQL
        env:
          OPENEYE_BIN: target/debug/openeye
          OPENEYE_RUNNER: java -jar jvm/build/libs/openeye-jvm.jar
        run: scripts/demo.sh

  docker:
    name: Container image
    runs-on: ubuntu-latest
    needs: jariko
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --abort-on-container-exit --exit-code-from openeye
