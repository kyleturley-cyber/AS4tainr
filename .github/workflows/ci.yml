name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: Rust core + bridge conformance
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ibmish
          POSTGRES_PASSWORD: ibmish
          POSTGRES_DB: ibmish
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ibmish" --health-interval 2s --health-retries 30
    env:
      IBMISH_TEST_DATABASE_URL: postgres://ibmish:ibmish@127.0.0.1/ibmish
      IBMISH_DATABASE_URL: postgres://ibmish:ibmish@127.0.0.1/ibmish
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Compile the dependency-free bridge client and conformance runner
        run: javac -d target/conformance-classes jvm/src/main/java/io/ibmish/bridge/*.java jvm/src/test/java/io/ibmish/bridge/*.java
      - name: End-to-end with the conformance runner
        env:
          IBMISH_BIN: target/debug/ibmish
          IBMISH_RUNNER: java -cp target/conformance-classes io.ibmish.bridge.BridgeConformance
        run: |
          scripts/demo.sh
          target/debug/ibmish call SELFTEST

  jariko:
    name: Jariko runner end to end
    runs-on: ubuntu-latest
    needs: core
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ibmish
          POSTGRES_PASSWORD: ibmish
          POSTGRES_DB: ibmish
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ibmish" --health-interval 2s --health-retries 30
    env:
      IBMISH_DATABASE_URL: postgres://ibmish:ibmish@127.0.0.1/ibmish
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: cargo build --locked
      - name: Build ibmish-jvm.jar (Jariko + bridge adapter)
        working-directory: jvm
        run: ./gradlew --no-daemon fatJar
      - name: Run the sample RPG programs on Jariko against PostgreSQL
        env:
          IBMISH_BIN: target/debug/ibmish
          IBMISH_RUNNER: java -jar jvm/build/libs/ibmish-jvm.jar
        run: scripts/demo.sh

  tn5250:
    name: 5250 server with the real tn5250 client
    runs-on: ubuntu-latest
    needs: jariko
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ibmish
          POSTGRES_PASSWORD: ibmish
          POSTGRES_DB: ibmish
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ibmish" --health-interval 2s --health-retries 30
    env:
      IBMISH_DATABASE_URL: postgres://ibmish:ibmish@127.0.0.1/ibmish
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build tn5250 (test client only; not shipped)
        run: |
          sudo apt-get update && sudo apt-get install -y cmake libncurses-dev libssl-dev
          git clone --depth 1 https://github.com/tn5250/tn5250.git /tmp/tn5250
          cmake -S /tmp/tn5250 -B /tmp/tn5250/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/tn5250/build -j 2
          pip install pyte
      - run: cargo build --locked
      - name: Build ibmish-jvm.jar
        working-directory: jvm
        run: ./gradlew --no-daemon fatJar
      - name: Start the 5250 server with the sample files
        run: |
          target/debug/ibmish init
          target/debug/ibmish crtpf QGPL/CUSTMAST --src samples/qddssrc/CUSTMAST.pf
          target/debug/ibmish load CUSTMAST --csv samples/data/CUSTMAST.csv
          IBMISH_PGM_PATH=$PWD/samples/qrpglesrc nohup target/debug/ibmish tn5250 \
            --listen 127.0.0.1:2323 --runner "java -jar jvm/build/libs/ibmish-jvm.jar" > tn5250-server.log 2>&1 &
          sleep 2
      - name: Sign on, CRTLIB, DSPLIB, CALL, SIGNOFF through tn5250
        env:
          TN5250: /tmp/tn5250/build/curses/tn5250
        run: python3 tools/e2e_5250.py 127.0.0.1:2323
      - if: failure()
        run: cat tn5250-server.log

  docker:
    name: Container image
    runs-on: ubuntu-latest
    needs: jariko
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose run --rm demo
