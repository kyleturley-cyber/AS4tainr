name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: Rust core + bridge conformance
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ibmish
          POSTGRES_PASSWORD: ibmish
          POSTGRES_DB: ibmish
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ibmish" --health-interval 2s --health-retries 30
    env:
      IBMISH_TEST_DATABASE_URL: postgres://ibmish:ibmish@127.0.0.1/ibmish
      IBMISH_DATABASE_URL: postgres://ibmish:ibmish@127.0.0.1/ibmish
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Compile the dependency-free bridge client and conformance runner
        run: javac -d target/conformance-classes jvm/src/main/java/io/ibmish/bridge/*.java jvm/src/test/java/io/ibmish/bridge/*.java
      - name: End-to-end with the conformance runner
        env:
          IBMISH_BIN: target/debug/ibmish
          IBMISH_RUNNER: java -cp target/conformance-classes io.ibmish.bridge.BridgeConformance
        run: |
          scripts/demo.sh
          target/debug/ibmish call SELFTEST

  jariko:
    name: Jariko runner end to end
    runs-on: ubuntu-latest
    needs: core
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ibmish
          POSTGRES_PASSWORD: ibmish
          POSTGRES_DB: ibmish
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ibmish" --health-interval 2s --health-retries 30
    env:
      IBMISH_DATABASE_URL: postgres://ibmish:ibmish@127.0.0.1/ibmish
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: cargo build --locked
      - name: Build ibmish-jvm.jar (Jariko + bridge adapter)
        working-directory: jvm
        run: ./gradlew --no-daemon fatJar
      - name: Run the sample RPG programs on Jariko against PostgreSQL
        env:
          IBMISH_BIN: target/debug/ibmish
          IBMISH_RUNNER: java -jar jvm/build/libs/ibmish-jvm.jar
        run: scripts/demo.sh

  docker:
    name: Container image
    runs-on: ubuntu-latest
    needs: jariko
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --abort-on-container-exit --exit-code-from ibmish
