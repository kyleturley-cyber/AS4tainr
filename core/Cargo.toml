[package]
name = "as4tainr-core"
description = "as4tainr: an IBM i-compatible runtime: catalog, DDS, record-level access, CL, 5250 and an RPG engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "as4tainr"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "sync", "signal"] }
tokio-postgres = "0.7"
thiserror = "1"
argon2 = { version = "0.5", features = ["std"] }
password-hash = { version = "0.5", features = ["getrandom"] }
rust_decimal = "1"
roxmltree = "0.20"
base64 = "0.22"
bytes = "1"
futures-util = { version = "0.3", features = ["sink"] }
flate2 = "1"
