# Spike 01: PostgreSQL plus the ibmish image running the sample programs.
#   docker compose up --build --abort-on-container-exit
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ibmish
      POSTGRES_PASSWORD: ibmish
      POSTGRES_DB: ibmish
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ibmish"]
      interval: 2s
      retries: 30

  ibmish:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ghcr.io/ibmish/ibmish:dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      IBMISH_DATABASE_URL: postgres://ibmish:ibmish@db/ibmish
    entrypoint: ["/opt/ibmish/demo.sh"]

volumes:
  pgdata: {}
