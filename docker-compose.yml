# ibmish: PostgreSQL plus the ibmish 5250 server.
#
#   docker compose up --build
#
# Then connect a 5250 emulator (tn5250, tn5250j, IBM ACS) to localhost:2323
# and sign on as QSECOFR. On first start the password is QSECOFR and must be
# changed, unless IBMISH_QSECOFR_PASSWORD is set below.
#
# The spike demo (sample programs checked against golden output):
#   docker compose run --rm demo
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ibmish
      POSTGRES_PASSWORD: ibmish
      POSTGRES_DB: ibmish
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ibmish"]
      interval: 2s
      retries: 30

  ibmish:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ghcr.io/ibmish/ibmish:dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      IBMISH_DATABASE_URL: postgres://ibmish:ibmish@db/ibmish
      IBMISH_SYSTEM_NAME: IBMISH
      # IBMISH_QSECOFR_PASSWORD: change-me   # skips the forced first change
      # IBMISH_QPWDLVL: "2"   # case-sensitive passwords (default 0: not case sensitive, like IBM i as shipped)
    ports:
      - "2323:23"

  demo:
    image: ghcr.io/ibmish/ibmish:dev
    profiles: ["demo"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      IBMISH_DATABASE_URL: postgres://ibmish:ibmish@db/ibmish
    entrypoint: ["/opt/ibmish/demo.sh"]

volumes:
  pgdata: {}
