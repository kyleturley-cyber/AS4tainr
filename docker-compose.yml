# Spike 01: PostgreSQL plus the OpenEye image running the sample programs.
#   docker compose up --build --abort-on-container-exit
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: openeye
      POSTGRES_PASSWORD: openeye
      POSTGRES_DB: openeye
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openeye"]
      interval: 2s
      retries: 30

  openeye:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ghcr.io/openeye/openeye:dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      OPENEYE_DATABASE_URL: postgres://openeye:openeye@db/openeye
    entrypoint: ["/opt/openeye/demo.sh"]

volumes:
  pgdata: {}
